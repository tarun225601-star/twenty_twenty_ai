<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Auto-Pusher & Project Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; margin: 0; }
        .container { max-width: 700px; margin: auto; }
        .box { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; }
        h3 { color: #facc15; font-size: 16px; margin: 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        label { display: block; margin-top: 10px; font-size: 13px; color: #94a3b8; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #475569; color: #fff; box-sizing: border-box; border-radius: 4px; font-size: 14px; }
        textarea { height: 100px; }
        button { background: #0284c7; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 12px; font-size: 15px; }
        button:hover { background: #0369a1; }
        .push-btn { background: #10b981; }
        .push-btn:hover { background: #059669; }
        .file-box { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 6px; margin-top: 15px; }
        .path { color: #facc15; font-weight: bold; font-family: monospace; font-size: 13px; margin-bottom: 5px; }
        pre { background: #020617; padding: 10px; overflow-x: auto; color: #34d399; font-size: 12px; border-radius: 4px; margin: 5px 0 0 0; }
        .copy-btn { background: #475569; padding: 6px 12px; font-size: 12px; width: auto; margin-top: 5px; }
        .hidden { display: none; }
        .status { margin-top: 10px; font-weight: bold; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Android Project Auto-Pusher</h2>

    <!-- Settings Box -->
    <div class="box">
        <h3 onclick="toggleSettings()">
            <span>⚙️ GitHub Settings (गियर सेटिंग)</span>
            <span>▼</span>
        </h3>
        <div id="settingsContent" class="hidden" style="margin-top: 10px;">
            <label>GitHub Username:</label>
            <input type="text" id="ghUser" placeholder="उदा. tarun">

            <label>Repository Name:</label>
            <input type="text" id="ghRepo" placeholder="उदा. viziag-app">

            <label>GitHub Personal Access Token (PAT):</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
        </div>
    </div>

    <!-- Main Form Box -->
    <div class="box">
        <label>App Name (ऐप का नाम):</label>
        <input type="text" id="appName" value="Viziag Mart">
        
        <label>Package Name (पैकेज नाम):</label>
        <input type="text" id="pkgName" value="com.viziag.app">
        
        <label>index.html Code:</label>
        <textarea id="htmlCode">&lt;h1&gt;Hello Viziag&lt;/h1&gt;</textarea>
        
        <button onclick="generateFiles()">1. Generate Files & Code (फाइलें देखें)</button>
        <button class="push-btn" onclick="pushAllToGitHub()">2. Auto Push All to GitHub (सीधे गिटहब पर भेजें) 🚀</button>
        <div id="statusMsg" class="status"></div>
    </div>

    <div id="result"></div>
</div>

<script>
function toggleSettings() {
    const content = document.getElementById('settingsContent');
    content.classList.toggle('hidden');
}

function getProjectFiles() {
    const app = document.getElementById('appName').value || "ViziagApp";
    const pkg = document.getElementById('pkgName').value || "com.viziag.app";
    const html = document.getElementById('htmlCode').value || "<h1>Hello</h1>";
    const pathPkg = pkg.replace(/\./g, '/');

    const wf = `name: Build Signed Release APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleRelease
    - uses: actions/upload-artifact@v4
      with:
        name: signed-release-app
        path: app/build/outputs/apk/release/app-release.apk`;

    const mani = `<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="${pkg}">
    <uses-permission android:name="android.permission.INTERNET" />
    <application android:label="${app}" android:usesCleartextTraffic="true">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>`;

    const main = `package ${pkg};
import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;
public class MainActivity extends AppCompatActivity {
    @Override protected void onCreate(Bundle b) {
        super.onCreate(b);
        WebView w = new WebView(this);
        w.getSettings().setJavaScriptEnabled(true);
        w.setWebViewClient(new WebViewClient());
        w.loadUrl("file:///android_asset/index.html");
        setContentView(w);
    }
}`;

    const sets = `pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = "${app}"; include ':app'`;

    const gradle = `plugins { id 'com.android.application' }
android {
    namespace '${pkg}'
    compileSdk 34
    defaultConfig { applicationId "${pkg}"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }`;

    return [
        { path: ".github/workflows/build-apk.yml", content: wf },
        { path: "app/src/main/AndroidManifest.xml", content: mani },
        { path: `app/src/main/java/${pathPkg}/MainActivity.java`, content: main },
        { path: "app/src/main/assets/index.html", content: html },
        { path: "settings.gradle", content: sets },
        { path: "app/build.gradle", content: gradle }
    ];
}

function generateFiles() {
    const files = getProjectFiles();
    let htmlOut = "";
    files.forEach((f, index) => {
        const uniqueId = 'code_' + index;
        htmlOut += `
            <div class="file-box">
                <div class="path">📁 Path: ${f.path}</div>
                <button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('${uniqueId}').innerText); alert('Copied!');">Copy Code</button>
                <pre><code id="${uniqueId}">${escapeHtml(f.content)}</code></pre>
            </div>
        `;
    });
    document.getElementById('result').innerHTML = htmlOut;
    document.getElementById('statusMsginnerText'] = "";
}

async function pushAllToGitHub() {
    const user = document.getElementById('ghUser').value.trim();
    const repo = document.getElementById('ghRepo').value.trim();
    const token = document.getElementById('ghToken').value.trim();
    const status = document.getElementById('statusMsg');

    if (!user || !repo || !token) {
        alert("कृपया पहले ऊपर गियर सेटिंग (⚙️) पर क्लिक करके Username, Repo Name और GitHub Token भरें!");
        return;
    }

    const files = getProjectFiles();
    status.innerText = "गिटहब पर फाइलें भेजी जा रही हैं...";
    status.style.color = "#facc15";

    for (let f of files) {
        try {
            const url = `https://api.github.com/repos/${user}/${repo}/contents/${f.path}`;
            let sha = "";
            const getRes = await fetch(url, {
                headers: { "Authorization": `token ${token}` }
            });
            if (getRes.ok) {
                const data = await getRes.json();
                sha = data.sha;
            }

            const bodyData = {
                message: `Auto push ${f.path} via Web Tool`,
                content: btoa(unescape(encodeURIComponent(f.content)))
            };
            if (sha) bodyData.sha = sha;

            const putRes = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(bodyData)
            });

            if (!putRes.ok) {
                throw new Error(`Failed to upload ${f.path}`);
            }
        } catch (err) {
            status.innerText = "एरर: " + err.message;
            status.style.color = "#ef4444";
            return;
        }
    }

    status.innerText = "सफलतापूर्वक सारी फाइलें गिटहब पर पुश हो गईं! 🚀";
    status.style.color = "#34d399";
}

function escapeHtml(t) {
    return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>

</body>
</html>
