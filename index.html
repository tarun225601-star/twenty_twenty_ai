<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Cinematic Studio & Real Audio Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0d12;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h2 {
            margin-bottom: 15px;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        /* कण्ट्रोल पैनल */
        .control-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 750px;
            margin-bottom: 20px;
            background: #151821;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2a2f3d;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="file"], select {
            flex: 1;
            padding: 10px;
            background: #1f2430;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #6366f1;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #4f46e5;
        }

        .test-btn {
            background: #0ea5e9;
        }
        .test-btn:hover {
            background: #0284c7;
        }

        /* 360 वीडियो फ्रेम */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            overflow: hidden;
            border-radius: 12px;
            background: #151821;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        /* 360 मोशन इफ़ेक्ट */
        .cinematic-image {
            width: 120%;
            height: 120%;
            object-fit: cover;
            display: none;
        }

        .active-360-motion {
            display: block;
            animation: motion360 15s infinite alternate ease-in-out;
        }

        @keyframes motion360 {
            0% { transform: scale(1) translate(0px, 0px) rotate(0deg); }
            33% { transform: scale(1.12) translate(-30px, -15px) rotate(1deg); }
            66% { transform: scale(1.12) translate(30px, 10px) rotate(-1deg); }
            100% { transform: scale(1.05) translate(0px, 0px) rotate(0deg); }
        }

        /* पानी और शैडो ओवरले */
        .water-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(0, 130, 255, 0.12) 100%);
            mix-blend-mode: overlay;
            pointer-events: none;
            display: none;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.7);
            pointer-events: none;
            display: none;
        }

        .placeholder-text {
            color: #475569;
            font-size: 15px;
            text-align: center;
            padding: 0 20px;
        }

        /* डाउनलोड और एक्शन बटन */
        .actions-box {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .download-btn {
            display: none;
            background: #10b981;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }
        .download-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <h2>360 Cinematic Studio with Live Audio Test & Player</h2>

    <!-- कण्ट्रोल बॉक्स -->
    <div class="control-box">
        <div class="row">
            <!-- इमेज अपलोड -->
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <div class="row">
            <!-- रियल ऑनलाइन म्यूजिक लिस्ट -->
            <select id="musicSelector">
                <option value="">-- ऑनलाइन बैकग्राउंड म्यूजिक / झरना चुनें --</option>
                <option value="https://upload.wikimedia.org/wikipedia/commons/b/b2/Ambient_waterfall_sound_%28nature_ambience%29.ogg">💧 Nature Waterfall Ambience (Original Sound)</option>
                <option value="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=relaxing-chill-out-110845.mp3">🎶 Relaxing Cinematic Chill (Music)</option>
                <option value="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=ambient-piano-and-strings-10711.mp3">🎹 Peaceful Piano & Ambient Strings</option>
            </select>
            <!-- पहले गाना बजाकर चेक करने का बटन -->
            <button type="button" class="test-btn" onclick="testSelectedMusic()">🔊गाना सुनकर देखें</button>
        </div>
        <div class="row">
            <button style="width:100%; background: #6366f1;" onclick="startExperience()">🎬 360 व्यू और वीडियो प्ले करें</button>
        </div>
    </div>

    <!-- वीडियो जैसा एनिमेटेड फ्रेम -->
    <div class="video-container" id="videoContainer">
        <span class="placeholder-text" id="placeholderText">अपनी फोटो अपलोड करें, म्यूजिक चेक करें और फिर '360 व्यू' चलाएं!</span>
        <img id="resultImage" class="cinematic-image" alt="360 View">
        <div class="water-overlay" id="waterOverlay"></div>
        <div class="vignette" id="vignetteLayer"></div>
    </div>

    <!-- ऑडियो प्लेयर -->
    <audio id="bgMusic" crossorigin="anonymous" loop></audio>

    <!-- डाउनलोड बटन -->
    <div class="actions-box">
        <a id="downloadImageBtn" class="download-btn" href="#" download="cinematic-360-view.jpg">💾 एनिमेटेड फोटो सेव करें</a>
    </div>

    <script>
        const bgMusic = document.getElementById('bgMusic');

        // गाना सेलेक्ट करके पहले टेस्ट (सुनकर देखने) के लिए फंक्शन
        function testSelectedMusic() {
            const musicSelector = document.getElementById('musicSelector');
            const selectedUrl = musicSelector.value;

            if (!selectedUrl) {
                alert('भाई, पहले लिस्ट में से कोई गाना तो सेलेक्ट कर!');
                return;
            }

            bgMusic.src = selectedUrl;
            bgMusic.currentTime = 0;
            bgMusic.play().then(() => {
                alert('गाना बज रहा है भाई! चेक कर ले, पसंद आए तो रोककर फाइनल व्यू चला देना। (बंद करने के लिए ओके दबाएं)');
            }).catch(err => {
                alert('गाना लोड होने में दिक्कत आई, दूसरा सेलेक्ट करके देखें।');
                console.error(err);
            });
        }

        // फाइनल 360 व्यू और म्यूजिक चलाने का फंक्शन
        function startExperience() {
            const fileInput = document.getElementById('imageInput');
            const musicSelector = document.getElementById('musicSelector');
            const placeholder = document.getElementById('placeholderText');
            const resultImg = document.getElementById('resultImage');
            const waterOverlay = document.getElementById('waterOverlay');
            const vignetteLayer = document.getElementById('vignetteLayer');
            const downloadImageBtn = document.getElementById('downloadImageBtn');

            if (!fileInput.files || !fileInput.files[0]) {
                alert('भाई, पहले अपनी कोई बढ़िया फोटो तो अपलोड कर!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;

                // स्क्रीन सेटिंग्स अपडेट
                placeholder.style.display = 'none';
                resultImg.src = imageUrl;
                resultImg.style.display = 'block';
                resultImg.classList.add('active-360-motion');
                waterOverlay.style.display = 'block';
                vignetteLayer.style.display = 'block';

                // अगर म्यूजिक सेलेक्ट किया है तो उसे फाइनल प्ले करना
                if (musicSelector.value) {
                    bgMusic.src = musicSelector.value;
                    bgMusic.currentTime = 0;
                    bgMusic.play().catch(err => console.log("Audio play error:", err));
                }

                // डाउनलोड बटन दिखाना
                downloadImageBtn.href = imageUrl;
                downloadImageBtn.style.display = 'inline-block';
            };
            reader.readAsDataURL(fileInput.files[0]);
        }
    </script>
</body>
</html>
