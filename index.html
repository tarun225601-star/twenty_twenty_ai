<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Image to Video Effect Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f1115;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        /* कण्ट्रोल बॉक्स (इमेज अपलोड और बटन) */
        .control-box {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 20px;
            background: #1a1d24;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="file"] {
            flex: 1;
            color: #bbb;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #6366f1;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #4f46e5;
        }

        /* वीडियो जैसा फ्रेम (मूवी प्लेयर) */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            overflow: hidden;
            border-radius: 12px;
            background: #1a1d24;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        /* सिनेमैटिक ज़ूम इफ़ेक्ट (Ken Burns) */
        .cinematic-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .active-zoom {
            display: block;
            animation: zoomEffect 12s infinite alternate ease-in-out;
        }

        @keyframes zoomEffect {
            0% {
                transform: scale(1) translate(0, 0);
            }
            100% {
                transform: scale(1.18) translate(-15px, -10px);
            }
        }

        /* बहते हुए पानी का इफ़ेक्ट (Overlay) */
        .water-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(0, 140, 255, 0.15) 100%);
            mix-blend-mode: overlay;
            pointer-events: none;
            display: none;
            animation: waterFlow 3s infinite linear;
        }

        @keyframes waterFlow {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        .placeholder-text {
            color: #475569;
            font-size: 15px;
        }

        /* सेव करने का बटन */
        .download-btn {
            display: none;
            background: #10b981;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .download-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>

    <h2>Cinematic Image-to-Video Player</h2>

    <!-- इमेज अपलोड और प्ले बटन -->
    <div class="control-box">
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="playCinematicEffect()">चलाओ (Play Effect)</button>
    </div>

    <!-- वीडियो फ्रेम और इफ़ेक्ट -->
    <div class="video-container" id="videoContainer">
        <span class="placeholder-text" id="placeholderText">अपनी इमेज अपलोड करके 'चलाओ' बटन दबाएं...</span>
        <img id="resultImage" class="cinematic-image" alt="Cinematic View">
        <div class="water-overlay" id="waterOverlay"></div>
    </div>

    <!-- डाउनलोड बटन -->
    <a id="downloadBtn" class="download-btn" href="#" download="cinematic-view.jpg">💾 फोटो सेव करें</a>

    <script>
        function playCinematicEffect() {
            const fileInput = document.getElementById('imageInput');
            const placeholder = document.getElementById('placeholderText');
            const resultImg = document.getElementById('resultImage');
            const waterOverlay = document.getElementById('waterOverlay');
            const downloadBtn = document.getElementById('downloadBtn');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    const imageUrl = e.target.result;

                    // यूआई अपडेट करना
                    placeholder.style.display = 'none';
                    resultImg.src = imageUrl;
                    resultImg.style.display = 'block';
                    resultImg.classList.add('active-zoom'); // ज़ूम इफ़ेक्ट शुरू
                    waterOverlay.style.display = 'block';   // बहते पानी का इफ़ेक्ट शुरू

                    // डाउनलोड लिंक सेट करना
                    downloadBtn.href = imageUrl;
                    downloadBtn.style.display = 'inline-block';
                }

                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert('भाई, पहले कोई इमेज तो चुन ले!');
            }
        }
    </script>
</body>
</html>
